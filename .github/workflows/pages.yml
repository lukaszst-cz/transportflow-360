name: Pages after QA

on:
  workflow_run:
    workflows: ["Quality checks"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Resolve revision
        id: revision
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Pages publishing mode
        id: pages_mode
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.request("GET /repos/{owner}/{repo}/pages", {
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const workflowMode = data.build_type === "workflow";
            core.info(`GitHub Pages build_type: ${data.build_type}`);
            core.setOutput("workflow_mode", workflowMode ? "true" : "false");

      - name: Pages source still uses branch publishing
        if: steps.pages_mode.outputs.workflow_mode != 'true'
        run: echo "Deployment skipped. In Settings > Pages set Source to GitHub Actions to make successful QA the publishing gate."

      - name: Check out verified revision
        if: steps.pages_mode.outputs.workflow_mode == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.revision.outputs.sha }}

      - name: Configure Pages
        if: steps.pages_mode.outputs.workflow_mode == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.pages_mode.outputs.workflow_mode == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        if: steps.pages_mode.outputs.workflow_mode == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
